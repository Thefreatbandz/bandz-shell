<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bandz Shell</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root { --bg:#0d0d0f; --fg:#e8c15a; --dim:#8a743f; --accent:#ffe9a8; --prompt:#e8c15a; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; line-height:1.45; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100dvh; padding-bottom:env(safe-area-inset-bottom); }
#statusbar { display:flex; justify-content:space-between; padding:8px 12px 4px; font-size:12px; color:var(--dim); border-bottom:1px solid var(--dim); }
#out { flex:1; overflow-y:auto; padding:10px 12px; -webkit-overflow-scrolling:touch; }
.line { margin:2px 0; word-break:break-word; }
.line pre { margin:2px 0; font-size:12px; line-height:1.3; overflow-x:auto; }
.cmdline { cursor:pointer; }
.prompt { color:var(--prompt); font-weight:bold; }
.dim { color:var(--dim); }
.accent { color:var(--accent); }
a { color:var(--accent); }
#dungeonview { padding:4px 12px; }
.dhud { color:var(--accent); margin-bottom:4px; font-size:13px; }
.dmap { font-size:11px; line-height:1.25; letter-spacing:1px; }
#inputrow { display:flex; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--dim); }
#cmd { flex:1; background:transparent; border:none; outline:none; color:var(--fg); font:inherit; font-size:16px; caret-color:var(--accent); min-width:0; }
#keybar { display:flex; gap:6px; overflow-x:auto; padding:8px 12px 10px; border-top:1px solid var(--dim); }
.key { flex:0 0 auto; background:transparent; color:var(--fg); border:1px solid var(--dim); border-radius:8px; padding:8px 12px; font:inherit; font-size:14px; }
.key:active { background:var(--dim); color:var(--bg); }
/* CRT */
#crtfx { display:none; position:fixed; inset:0; pointer-events:none; z-index:50;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  animation:flick 4s infinite; }
#crtfx::after { content:''; position:absolute; inset:0; box-shadow:inset 0 0 120px rgba(0,0,0,.55); border-radius:8px; }
@keyframes flick { 0%,100%{opacity:.9} 50%{opacity:1} 52%{opacity:.85} 54%{opacity:1} }
body.crt #crtfx { display:block; }
body.crt #out, body.crt #dungeonview { text-shadow:0 0 6px var(--fg); }
/* boot */
#boot { position:fixed; inset:0; z-index:100; background:#000; color:#e8c15a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; cursor:pointer; animation:bootflick 3s infinite; }
#boot.hidden { display:none; }
#boot pre { font-size:11px; line-height:1.2; margin:0; text-shadow:0 0 12px #e8c15a; }
#boot .tap { border:1px solid #e8c15a; border-radius:10px; padding:10px 26px; letter-spacing:3px; animation:pulse 1.6s infinite; }
@keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
@keyframes bootflick { 0%,100%{opacity:1} 48%{opacity:1} 50%{opacity:.92} 52%{opacity:1} }
</style>
</head>
<body>
<div id="crtfx"></div>
<div id="boot">
<pre>██████╗  █████╗ ███╗   ██╗██████╗ ███████╗
██╔══██╗██╔══██╗████╗  ██║██╔══██╗╚══███╔╝
██████╔╝███████║██╔██╗ ██║██║  ██║  ███╔╝
██╔══██╗██╔══██║██║╚██╗██║██║  ██║ ███╔╝
██████╔╝██║  ██║██║ ╚████║██████╔╝███████╗
╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═══╝╚═════╝ ╚══════╝</pre>
<div class="tap">TAP TO ENTER</div>
</div>
<div id="app">
  <div id="statusbar"><span id="clock">--:--</span><span id="pnl">paper mode</span></div>
  <div id="out"></div>
  <div id="dungeonview" style="display:none"></div>
  <div id="inputrow">
    <span class="prompt">tbandz@bandz:~$</span>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="command input">
  </div>
  <div id="keybar"></div>
</div>
<script src="app.js"></script>
</body>
</html>
